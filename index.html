<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maison Anna Flowers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--pink:#FCE4EC;--card:#FFF5F8;--green:#1F3D33;--rose:#B5173F;--yellow:#F7D861;--blush:#F5C6D4}
*{box-sizing:border-box;margin:0}
body{background:var(--pink);color:var(--green);font:500 16px/1.5 "Nunito",system-ui,sans-serif;padding:12px 12px 90px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:3px}

.top{position:sticky;top:10px;z-index:20;background:var(--card);border-radius:32px;padding:14px 18px;box-shadow:0 8px 24px #b5173f22;max-width:1100px;margin:0 auto}
.row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.left{display:flex;gap:6px}
.icon{background:none;border:0;font-size:1.5rem;padding:6px}
.logo{text-align:center;text-decoration:none;font-weight:800;font-size:clamp(1.4rem,6vw,2.2rem);letter-spacing:.04em;line-height:1}
.logo small{display:block;font-size:.5rem;letter-spacing:.3em;color:#5c7a6c;margin-top:6px;font-weight:700}
.cart{justify-self:end;position:relative}
#badge{position:absolute;top:-2px;right:-4px;background:#E8508A;color:#fff;border-radius:50%;min-width:22px;height:22px;font-size:.8rem;font-weight:800;display:grid;place-items:center}
#menu{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--blush)}
#menu[hidden],#q[hidden]{display:none}
.chip{background:none;border:1.5px solid var(--green);border-radius:999px;padding:5px 14px;font-size:.85rem;font-weight:700}
.chip[aria-pressed="true"]{background:var(--green);color:#fff}
#q{width:100%;margin-top:12px;padding:10px 16px;border-radius:999px;border:1.5px solid var(--blush);font:inherit;background:#fff}

.intro{max-width:1100px;margin:28px auto 8px;padding:0 8px}
.intro h1{font-size:clamp(1.6rem,5vw,2.6rem);line-height:1.15;font-weight:800}
.intro p{margin-top:6px;color:#5c7a6c}
#followers{font-weight:700}

.grid{max-width:1100px;margin:20px auto 0;display:grid;grid-template-columns:repeat(2,1fr);gap:28px 14px}
@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr);gap:36px 20px}}
.ph{position:relative;aspect-ratio:4/5;border-radius:28px;overflow:hidden;background:linear-gradient(160deg,#F9D3DF,#EFB3C6);box-shadow:0 8px 20px #b5173f1f;border:1px solid #fff8}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.save{position:absolute;top:12px;left:12px;background:var(--yellow);color:var(--green);font-weight:800;font-size:.75rem;padding:8px 14px;border-radius:999px;z-index:2;transform:rotate(-4deg)}
.add{position:absolute;right:10px;bottom:10px;background:var(--green);color:#fff;border:1px solid #ffffff55;border-radius:999px;padding:11px 16px;font-weight:800;font-size:.78rem;letter-spacing:.1em;text-decoration:none;display:inline-block}
.card h3{font-size:1.1rem;font-weight:800;margin-top:12px;line-height:1.25}
.pr{margin-top:2px;font-size:1.05rem}
.pr b{font-weight:800}.pr b.sale{color:var(--rose)}
.pr s{color:#6d7c74;margin-left:6px}
.empty{grid-column:1/-1;padding:30px 0}

.chat{position:fixed;right:14px;bottom:16px;z-index:25;background:var(--green);color:#fff;text-decoration:none;border-radius:999px;padding:14px 22px;font-size:1.05rem;box-shadow:0 8px 20px #0003}
footer{max-width:1100px;margin:60px auto 0;padding:24px 8px;border-top:1px solid var(--blush);font-size:.85rem;color:#5c7a6c}

dialog{border:0;border-radius:28px;padding:24px;width:min(92vw,440px);max-height:90vh;overflow:auto;background:var(--card);color:var(--green)}
dialog::backdrop{background:#1f3d3355}
dialog h2{font-size:1.4rem;margin-bottom:12px}
dialog h3{font-size:1.05rem;font-weight:800;margin:18px 0 8px}
.line{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--blush)}
.line button{background:none;border:0;color:var(--rose);font-weight:700}
.total{font-weight:800;font-size:1.2rem;margin:14px 0}
.actions{display:flex;gap:10px;align-items:center}
.actions .add{position:static;border:0;cursor:pointer}
.actions .chip{padding:10px 18px}

#delivery[hidden]{display:none}
#delivery label{display:block;font-size:.8rem;font-weight:700;margin-top:10px}
#delivery input{width:100%;margin-top:4px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--blush);font:inherit;background:#fff;color:var(--green)}
#delivery .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#delivery .note{font-size:.78rem;color:#5c7a6c;margin:14px 0 4px}
</style>
</head>
<body>

<header class="top">
  <div class="row">
    <div class="left">
      <button class="icon" id="menuBtn" aria-label="Menu" aria-expanded="false">☰</button>
      <button class="icon" id="searchBtn" aria-label="Search">🔍</button>
    </div>
    <a class="logo" href="#" id="logo" aria-label="Maison Anna Flowers"></a>
    <button class="icon cart" id="cartBtn" aria-label="Open cart">🛒<span id="badge">0</span></button>
  </div>
  <nav id="menu" hidden aria-label="Filters">
    <div id="regions" style="display:flex;gap:8px;flex-wrap:wrap"></div>
    <div id="prices" style="display:flex;gap:8px;flex-wrap:wrap"></div>
  </nav>
  <input id="q" type="search" placeholder="Search flowers" hidden aria-label="Search flowers">
</header>

<section class="intro">
  <h1>Luxury flowers for the USA and Europe</h1>
  <p>Arrangements from $500 to $1,000,000. <span id="followers"></span></p>
</section>

<main class="grid" id="grid"></main>

<footer>© Maison Anna Flowers. Every order is confirmed personally.</footer>

<a class="chat" href="mailto:Riayoung280@gmail.com?subject=Live%20chat%20request">💬 Live chat</a>

<dialog id="cartDlg">
  <h2>Your cart</h2>
  <div id="items"></div>
  <p class="total" id="total"></p>

  <form id="delivery" hidden>
    <h3>Delivery details</h3>
    <label>Full name
      <input name="name" autocomplete="name" required>
    </label>
    <label>Email
      <input name="email" type="email" autocomplete="email" required>
    </label>
    <div class="two">
      <label>Country
        <input name="country" autocomplete="country-name" required>
      </label>
      <label>State
        <input name="state" autocomplete="address-level1" required>
      </label>
    </div>
    <label>Delivery address
      <input name="address" autocomplete="street-address" required>
    </label>
    <p class="note">Payment will be added soon. For now we confirm every order personally by email.</p>
    <div class="actions" style="margin-top:12px">
      <button class="add" type="submit">PLACE ORDER</button>
      <button class="chip" type="button" id="closeCart2">Close</button>
    </div>
  </form>

  <div class="actions" id="emptyActions">
    <button class="chip" type="button" id="closeCart">Close</button>
  </div>
</dialog>

<script>
const GITHUB_USERNAME="Maison-Anna";
const EMAIL="Riayoung280@gmail.com";

// Photos are free Unsplash images (same ones as your site).
// Replace the ids in IMGS, or add your own photo link per product, any time.
const U=id=>"https://unsplash.com/photos/"+id+"/download?force=true&w=800";
const IMGS=["PYP3x1lEUXU","vN8HQcKv8Lg","ibdyFSFWOkg","QfaXkfe5g3A","nZc3vd7BoCg","1Dy0nRW1Sas","FXHCqfusN-c"];

// [name, region (USA / Europe / Both), price, flags]
// flags: "f" = shows "From", "s" = 10% sale badge
const list=[
 // Your originals
 ["Blush Rose Bouquet","USA",500,"f"],
 ["Garden Rose Vase","Europe",1500,"s"],
 ["Bridal Rose Collection","USA",2200,"f"],
 ["Pink Peony Cloud","Europe",4500],
 ["Parisian Rose Box","Europe",990,"fs"],
 ["Manhattan Pink Garden","USA",7500,"f"],
 ["Paper-Wrapped Roses","Europe",650,"f"],
 ["Wedding Arch Collection","USA",18000,"f"],
 ["Château Estate Installation","Europe",240000,"f"],
 ["The Grand Gala Commission","Both",1000000],

 // Roses
 ["Classic Red Rose Dozen","USA",520],
 ["Two Dozen Long-Stem Roses","USA",780,"s"],
 ["Champagne Rose Bouquet","Europe",860],
 ["Ecuadorian Rose Tower","Europe",1250],
 ["Eternal Rose Hat Box","Europe",1900,"f"],
 ["White Rose Cascade","Europe",2800,"s"],
 ["Velvet Red Rose Hundred","USA",3800],
 ["Juliet Garden Rose Dome","Europe",5200],
 ["Rose Petal Bridal Suite","USA",6400,"f"],
 ["Five Hundred Roses Gift","USA",9800],
 ["Thousand Rose Declaration","Both",24000],

 // Peonies
 ["Coral Charm Peony Bouquet","USA",640,"f"],
 ["Sarah Bernhardt Peony Vase","Europe",1350],
 ["Blush Peony Centerpiece","USA",2100,"s"],
 ["Peony and Ranunculus Cloud","Europe",3300],
 ["White Peony Grand Urn","Europe",4800],
 ["Peony Season Signature Suite","USA",8700,"f"],

 // Orchids
 ["White Phalaenopsis Duo","USA",560],
 ["Orchid Silk Pavilion","Europe",1700,"s"],
 ["Cymbidium Cascade Planter","Europe",2600],
 ["Black Orchid Collection","USA",3900,"f"],
 ["Vanda Orchid Sculpture","Europe",6900],
 ["Imperial Orchid Conservatory","Both",32000,"f"],

 // Lilies and tulips
 ["Casablanca Lily Bouquet","USA",590],
 ["Stargazer Lily Arrangement","Europe",720,"s"],
 ["Calla Lily Elegance","Europe",1100],
 ["Dutch Tulip Masterpiece","Europe",1450,"f"],
 ["Parrot Tulip Display","Europe",2400],
 ["Royal Lily Column","USA",3600,"s"],

 // Hydrangea, ranunculus, delphinium
 ["Blue Hydrangea Grand Bowl","USA",880],
 ["Antique Hydrangea Cloud","Europe",1650,"s"],
 ["Ranunculus Silk Bouquet","Europe",1200],
 ["Delphinium and Larkspur Tower","Europe",2950],
 ["White Garden Hydrangea Wall","USA",7200,"f"],

 // Fragrant classics
 ["Gardenia Perfumed Collection","USA",830],
 ["Lilac Spring Bouquet","Europe",950],
 ["Sweet Pea Heirloom Vase","Europe",1050,"s"],
 ["Lily of the Valley Heirloom","Europe",1800,"f"],
 ["Stephanotis Bridal Crown","USA",2300],
 ["Jasmine Garland Collection","Europe",3100],
 ["Camellia Imperial Garden","Europe",4100],
 ["Magnolia Estate Collection","USA",5600,"s"],
 ["Wisteria Cascade Canopy","Europe",8400,"f"],
 ["Cherry Blossom Cloud","USA",11000],

 // Anniversaries and gifts
 ["Silver Anniversary Bouquet","USA",1600],
 ["Gold Anniversary Collection","USA",2750,"s"],
 ["Mother's Day Signature Box","USA",700,"s"],
 ["Valentine's Grand Declaration","Both",12500],
 ["Birthday Luxe Bouquet","Europe",610],
 ["Sympathy Lily Tribute","USA",900],
 ["Anniversary Rose Garden Box","Europe",3200,"f"],
 ["Proposal Rose Ring Display","Europe",15000,"f"],
 ["Diamond Jubilee Collection","Europe",28000],
 ["Golden Wedding Celebration","USA",14500,"s"],

 // Weddings and events
 ["Ceremony Aisle Garland","Europe",9500,"f"],
 ["Wedding Chuppah Florals","USA",13500],
 ["Grand Ballroom Centerpieces","Europe",16000,"f"],
 ["Cathedral Entrance Arrangement","Europe",21000],
 ["Bridal Bouquet and Bridesmaids Set","USA",8200],
 ["Rehearsal Dinner Florals","USA",10500,"f"],
 ["Royal Wedding Collection","Europe",38000,"f"],
 ["Gala Table Suite, 20 Tables","USA",45000],
 ["Red Carpet Floral Walkway","USA",52000,"f"],
 ["Palace Wedding Installation","Europe",85000],

 // Estates and ultra luxury
 ["Rooftop Garden Transformation","USA",60000,"f"],
 ["Mansion Entry Floral Sculpture","USA",72000],
 ["Yacht Charter Florals","Europe",95000,"f"],
 ["Grand Staircase Floral Cascade","Europe",120000],
 ["Penthouse Seasonal Subscription","USA",150000,"f"],
 ["Chateau Wedding Weekend","Europe",180000],
 ["Museum Gala Floral Takeover","USA",210000,"f"],
 ["Vineyard Estate Floral Season","Europe",260000],
 ["Estate Year of Flowers","Both",320000],
 ["Opera House Opening Night","Europe",360000,"f"],
 ["Royal Garden Party Commission","Europe",400000,"f"],
 ["Presidential Gala Florals","USA",440000],
 ["Hotel Lobby Floral Season","USA",480000],
 ["Fashion Week Floral Runway","Europe",550000,"f"],
 ["Palace Gardens Restoration","Europe",650000],
 ["Riviera Estate Rose Garden","Europe",700000,"f"],
 ["Imperial Wedding Spectacular","Both",750000,"f"],
 ["Crown Jewel Flower Ceremony","Europe",850000],
 ["Hamptons Estate Floral Legacy","USA",920000,"f"],
 ["The Millionaire's Rose Garden","Both",1000000]
];

const products=list.map((a,i)=>{
  const fl=a[3]||"",sale=fl.includes("s");
  return{n:a[0],reg:a[1],p:a[2],from:fl.includes("f"),sale,img:IMGS[i%IMGS.length],id:i,price:sale?Math.round(a[2]*0.9):a[2]};
});

const fmt=n=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0}).format(n);
const $=id=>document.getElementById(id);

// logo with coloured letters
const colors=["#E8508A","#F0762C","#9B6BD6","#E8508A","#4F7A38"];
$("logo").innerHTML=[..."MAISON ANNA"].map((c,i)=>c===" "?" ":`<span style="color:${colors[i%colors.length]}">${c}</span>`).join("")+"<small>FLOWERS · USA &amp; EUROPE</small>";

// followers
fetch("https://api.github.com/users/"+GITHUB_USERNAME)
 .then(r=>r.ok?r.json():Promise.reject())
 .then(u=>{$("followers").textContent=u.followers.toLocaleString("en-US")+" followers"})
 .catch(()=>{});

// filters
const regions=["All","USA","Europe"];
const bands=[["All prices",0,Infinity],["$500 – $5K",0,5000],["$5K – $50K",5000,50000],["$50K – $1M",50000,Infinity]];
let region="All",band=0,query="",cart=[];

function chips(box,items,label,set){
  items.forEach((it,i)=>{
    const b=document.createElement("button");
    b.className="chip";b.textContent=label(it);
    b.onclick=()=>{set(i);sync();render()};
    $(box).appendChild(b);
  });
}
function sync(){
  document.querySelectorAll("#regions .chip").forEach((b,i)=>b.setAttribute("aria-pressed",regions[i]===region));
  document.querySelectorAll("#prices .chip").forEach((b,i)=>b.setAttribute("aria-pressed",i===band));
}
chips("regions",regions,x=>x,i=>region=regions[i]);
chips("prices",bands,x=>x[0],i=>band=i);

$("menuBtn").onclick=()=>{const m=$("menu");m.hidden=!m.hidden;$("menuBtn").setAttribute("aria-expanded",!m.hidden)};
$("searchBtn").onclick=()=>{const q=$("q");q.hidden=!q.hidden;if(!q.hidden)q.focus()};
$("q").oninput=e=>{query=e.target.value.toLowerCase();render()};

// products
function render(){
  const [,lo,hi]=bands[band];
  const shown=products.filter(x=>
    (region==="All"||x.reg===region||x.reg==="Both")&&
    x.price>lo&&x.price<=hi&&
    x.n.toLowerCase().includes(query));
  $("grid").innerHTML=shown.length?shown.map(x=>`
    <article class="card">
      <div class="ph">
        ${x.sale?'<span class="save">SAVE 10%</span>':''}
        <img src="${U(x.img)}" alt="${x.n}" loading="lazy" onerror="this.remove()">
        <button class="add" data-id="${x.id}" aria-label="Add ${x.n} to cart">ADD TO 🛒</button>
      </div>
      <h3>${x.n}</h3>
      <div class="pr">${x.from?"From ":""}<b class="${x.sale?"sale":""}">${fmt(x.price)}</b>${x.sale?`<s>${fmt(x.p)}</s>`:""}</div>
    </article>`).join(""):'<p class="empty">Nothing matches yet. Try another search or price.</p>';
}
$("grid").onclick=e=>{
  const b=e.target.closest(".add");if(!b)return;
  cart.push(+b.dataset.id);updateCart();
  b.textContent="ADDED ✓";setTimeout(()=>b.textContent="ADD TO 🛒",1200);
};

// cart
function updateCart(){
  $("badge").textContent=cart.length;
  const total=cart.reduce((s,id)=>s+products[id].price,0);
  $("items").innerHTML=cart.length?cart.map((id,i)=>`<div class="line"><span>${products[id].n}<br><small>${fmt(products[id].price)}</small></span><button type="button" data-r="${i}">Remove</button></div>`).join(""):"<p>Your cart is empty.</p>";
  $("total").textContent=cart.length?"Total: "+fmt(total):"";
  $("delivery").hidden=!cart.length;
  $("emptyActions").style.display=cart.length?"none":"flex";
}
$("items").onclick=e=>{const r=e.target.dataset.r;if(r!==undefined){cart.splice(+r,1);updateCart()}};
$("cartBtn").onclick=()=>$("cartDlg").showModal();
$("closeCart").onclick=()=>$("cartDlg").close();
$("closeCart2").onclick=()=>$("cartDlg").close();

// delivery form -> order request email
// LATER: put your payment code here (Stripe, PayPal, etc.) before the email is sent.
$("delivery").onsubmit=e=>{
  e.preventDefault();
  if(!cart.length)return;
  const f=Object.fromEntries(new FormData(e.target));
  const total=cart.reduce((s,id)=>s+products[id].price,0);
  const lines=cart.map(id=>products[id].n+" - "+fmt(products[id].price)).join("\n");
  const body="ORDER\n"+lines+"\n\nTotal: "+fmt(total)+
    "\n\nDELIVERY DETAILS\nName: "+f.name+
    "\nEmail: "+f.email+
    "\nCountry: "+f.country+
    "\nState: "+f.state+
    "\nAddress: "+f.address;
  location.href="mailto:"+EMAIL+"?subject="+encodeURIComponent("Order request")+"&body="+encodeURIComponent(body);
};

sync();render();updateCart();
</script>
</body>
</html>
