<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment status | Maison Anna Flowers</title><style>body{margin:0;padding:28px 14px;background:#FCE4EC;color:#1F3D33;font:16px/1.5 system-ui,sans-serif}.box{max-width:560px;margin:8vh auto;background:#FFF8FA;border-radius:24px;padding:30px;box-shadow:0 8px 24px #b5173f22}h1{line-height:1.2}p{overflow-wrap:anywhere}a{color:inherit}</style></head><body><main class="box"><a href="/">← Maison Anna</a><h1 id="heading">Verifying your payment…</h1><p id="message">Please wait while we confirm the transaction directly with Paystack. Do not close this page.</p><p id="reference"></p></main><script>
(async()=>{const q=new URLSearchParams(location.search),ref=q.get("reference"),h=document.getElementById("heading"),m=document.getElementById("message"),r=document.getElementById("reference");if(!ref){h.textContent="Payment reference missing";m.textContent="Return to Maison Anna or contact the shop for assistance.";return}r.textContent="Reference: "+ref;try{const response=await fetch("/api/paystack/verify?reference="+encodeURIComponent(ref));const data=await response.json();if(!response.ok)throw new Error(data.error||"Verification failed.");if(data.status==="success"){h.textContent="Payment confirmed";m.textContent="Paystack has confirmed your payment of "+data.currency+" "+Number(data.amount).toLocaleString()+" for "+(data.customerEmail||"your order")+". Maison Anna can now confirm delivery arrangements."}else{h.textContent="Payment not confirmed";m.textContent="Current transaction status: "+data.status+". If you completed the payment, contact Maison Anna with the reference above."}}catch(e){h.textContent="Unable to verify payment";m.textContent=e.message+" You can contact Maison Anna with the reference above."}})();
</script></body></html>
