<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maison Anna | Payment status</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>:root{--green:#1F3D33;--pink:#FCE4EC;--rose:#B5173F;--line:#F5C6D4;--muted:#63776d}*{box-sizing:border-box}body{margin:0;padding:28px 14px;background:var(--pink);color:var(--green);font:16px/1.5 system-ui,sans-serif}.box{max-width:560px;margin:4vh auto;background:#fff8fa;border:1px solid var(--line);border-radius:24px;padding:clamp(20px,5vw,36px)}h1{line-height:1.15}label{display:block;font-weight:700;margin-top:14px}input,select{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;margin-top:6px;font:inherit}button{margin-top:18px;width:100%;padding:14px;border:0;border-radius:999px;background:var(--green);color:white;font-weight:800;font:inherit;cursor:pointer}.muted{color:var(--muted)}#result{margin-top:18px;padding:14px;border-radius:14px;background:#f8e8ee;overflow-wrap:anywhere}.state{font-size:1.1rem;font-weight:900}a{color:inherit}</style></head><body><main class="box"><a href="index.html">← Maison Anna</a><h1>Check your payment status</h1><p class="muted">Enter the reference shown after you submitted your order or gift cards, together with the email address used at checkout.</p><form id="lookup"><label>Submission type<select id="kind"><option value="order">Crypto order</option><option value="gift">Gift-card submission</option></select></label><label>Order / submission reference<input id="reference" required placeholder="Paste your reference"></label><label>Checkout email<input id="email" type="email" required></label><button>Check status</button></form><div id="result" hidden aria-live="polite"></div></main>
<script>
const db=window.supabase.createClient("https://ypzseilwcmvrzcjxanrs.supabase.co","sb_publishable_jgOjltlzCN42FWFiroFmig_VCW0TCZq");const $=id=>document.getElementById(id);const box=$("result");
$("lookup").addEventListener("submit",async e=>{e.preventDefault();box.hidden=false;box.textContent="Checking…";const ref=$("reference").value.trim(),email=$("email").value.trim(),kind=$("kind").value;if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(ref)){box.textContent="Enter a valid reference ID.";return}
const {data,error}=kind==="order"?await db.rpc("ma_customer_order_status",{p_order_id:ref,p_email:email}):await db.rpc("ma_customer_gift_status",{p_submission_id:ref,p_email:email});
if(error){box.textContent="Unable to check status right now. Please try again later.";return}const row=Array.isArray(data)?data[0]:data;if(!row){box.textContent="No matching submission was found. Check the reference and email address.";return}
const state=kind==="order"?row.payment_status:row.review_status;const labels={pending:"Pending verification",under_review:"Under review",confirmed:"Payment confirmed",approved:"Gift cards approved",rejected:"Not approved"};box.replaceChildren();const h=document.createElement("div");h.className="state";h.textContent=labels[state]||state;box.append(h);const p=document.createElement("p");p.textContent=kind==="order"?"Order reference: "+row.reference_id+" · "+row.currency+" "+row.total_amount:"Gift-card submission: "+row.reference_id+" · "+row.card_count+" card(s)";box.append(p);const note=document.createElement("p");note.className="muted";note.textContent=(state==="confirmed"||state==="approved")?"Maison Anna has confirmed your submission.":state==="rejected"?"Please contact Maison Anna if you need help with this submission.":"Your submission has not yet been confirmed. Please wait for review.";box.append(note)});
</script></body></html>
