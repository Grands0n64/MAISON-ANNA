<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maison Anna | Admin payments</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--green:#1F3D33;--pink:#FCE4EC;--rose:#B5173F;--line:#F5C6D4;--muted:#63776d}*{box-sizing:border-box}body{margin:0;padding:22px 14px 50px;background:var(--pink);color:var(--green);font:15px/1.5 system-ui, sans-serif}.wrap{max-width:1100px;margin:auto}.head,.panel,.entry{background:#fff8fa;border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:16px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-weight:900;letter-spacing:.12em}h1{font-size:1.5rem;margin:0}h2{font-size:1.15rem;margin:0 0 12px}.muted,small{color:var(--muted)}input,button{font:inherit}input{padding:12px;border:1px solid var(--line);border-radius:10px;width:100%;margin:6px 0 12px}button{border:0;border-radius:999px;background:var(--green);color:white;padding:10px 16px;font-weight:800;cursor:pointer;margin:4px}button.alt{background:#f5e5eb;color:var(--green)}button.reject{background:#9c243b}.entry{overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.pill{display:inline-block;padding:4px 10px;border-radius:30px;background:#f4e5eb;font-size:.8rem;font-weight:800}.actions{display:flex;gap:6px;flex-wrap:wrap}.photo{width:100px;height:100px;object-fit:cover;border-radius:10px;margin:5px}#dashboard[hidden],#login[hidden]{display:none!important}#message{white-space:pre-wrap;color:var(--rose)}
</style></head><body><div class="wrap">
<header class="head"><div><div class="brand">MAISON ANNA</div><h1>Payment administration</h1></div><a href="index.html">Visit shop</a></header>
<section id="login" class="panel"><h2>Admin sign in</h2><p class="muted">Only the designated administrator account can access payment records.</p><form id="loginForm"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form><p id="loginMessage"></p></section>
<section id="dashboard" hidden><div class="panel"><div class="actions"><button id="refresh">Refresh payments</button><button id="logout" class="alt">Sign out</button></div><p id="message"></p></div>
<h2>Crypto orders</h2><div id="orders" class="grid"></div>
<h2 style="margin-top:24px">Gift-card submissions</h2><div id="gifts" class="grid"></div></section></div>
<script>
const db=window.supabase.createClient("https://ypzseilwcmvrzcjxanrs.supabase.co","sb_publishable_jgOjltlzCN42FWFiroFmig_VCW0TCZq");
const $=id=>document.getElementById(id);const say=m=>$("message").textContent=m;
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function addField(parent,label,value){const p=el("p");p.append(el("strong",label+": "),document.createTextNode(value??"—"));parent.append(p)}
async function checkAdmin(){const {data:{session}}=await db.auth.getSession();if(!session){$("login").hidden=false;$("dashboard").hidden=true;return}const role=session.user.app_metadata?.role;if(role!=="admin"){await db.auth.signOut();$("login").hidden=false;$("dashboard").hidden=true;$("loginMessage").textContent="This account has not been assigned administrator access.";return}$("login").hidden=true;$("dashboard").hidden=false;await loadAll()}
async function loadAll(){say("Loading payment records…");const [o,g]=await Promise.all([db.rpc("ma_admin_list_orders"),db.rpc("ma_admin_list_gift_cards")]);if(o.error||g.error){say("Could not load records: "+(o.error?.message||g.error?.message));return}
$("orders").replaceChildren();$("gifts").replaceChildren();
(o.data||[]).forEach(row=>{const c=el("article",undefined,"entry");c.append(el("span",row.payment_status.toUpperCase(),"pill"));c.append(el("h3",row.customer_name));addField(c,"Order reference",row.id);addField(c,"Email",row.customer_email);addField(c,"Amount",row.currency+" "+row.total_amount);addField(c,"Method",row.payment_method+" / "+(row.payment_network||""));addField(c,"Transaction reference",row.transaction_hash);addField(c,"Submitted",new Date(row.created_at).toLocaleString());const a=el("div",undefined,"actions");[["confirmed","Confirm payment",""],["under_review","Under review","alt"],["rejected","Reject payment","reject"]].forEach(([s,t,k])=>{const b=el("button",t,k);b.onclick=()=>setOrder(row.id,s);a.append(b)});c.append(a);$("orders").append(c)});
const groups=new Map();(g.data||[]).forEach(row=>{if(!groups.has(row.submission_id))groups.set(row.submission_id,[]);groups.get(row.submission_id).push(row)});
for(const [id,rows] of groups){const first=rows[0],c=el("article",undefined,"entry");const state=rows.every(x=>x.review_status==="approved")?"approved":rows.some(x=>x.review_status==="rejected")?"rejected":rows.some(x=>x.review_status==="under_review")?"under_review":"pending";c.append(el("span",state.toUpperCase(),"pill"),el("h3",first.customer_name));addField(c,"Submission reference",id);addField(c,"Email",first.customer_email);for(const row of rows){const part=el("div");addField(part,row.gift_card_provider,row.currency+" "+row.card_amount);addField(part,"Gift card code",row.gift_card_code);const photos=el("div");for(const path of row.photo_paths||[]){const {data,error}=await db.storage.from("gift-card-evidence").createSignedUrl(path,300);if(!error&&data?.signedUrl){const img=el("img");img.src=data.signedUrl;img.alt="Gift card evidence";img.className="photo";photos.append(img)}}part.append(photos);c.append(part)}const a=el("div",undefined,"actions");[["approved","Approve gift cards",""],["under_review","Under review","alt"],["rejected","Reject gift cards","reject"]].forEach(([s,t,k])=>{const b=el("button",t,k);b.onclick=()=>setGift(id,s);a.append(b)});c.append(a);$("gifts").append(c)}
say("Loaded "+(o.data||[]).length+" crypto orders and "+groups.size+" gift-card submissions. Verify transactions and gift-card validity before approving.");}
async function setOrder(id,status){if(!confirm("Set payment status to "+status+"? Only do this after independent verification."))return;const {error}=await db.rpc("ma_admin_set_order_status",{p_order_id:id,p_status:status});if(error){say(error.message);return}await loadAll()}
async function setGift(id,status){const note=status==="rejected"?prompt("Reason for rejection (optional):"):"";if(status==="rejected"&&note===null)return;if(!confirm("Set all cards in this gift submission to "+status+"?"))return;const {error}=await db.rpc("ma_admin_set_gift_status",{p_submission_id:id,p_status:status,p_note:note});if(error){say(error.message);return}await loadAll()}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();$("loginMessage").textContent="Signing in…";const {error}=await db.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(error){$("loginMessage").textContent=error.message;return}await checkAdmin()});
$("refresh").onclick=loadAll;$("logout").onclick=async()=>{await db.auth.signOut();await checkAdmin()};db.auth.onAuthStateChange(()=>setTimeout(checkAdmin,0));checkAdmin();
</script></body></html>
